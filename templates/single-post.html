<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Building REST APIs with Django REST Framework | Kiana</title>

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">

        <!-- Bootstrap Icons -->
        <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

        <!-- Main CSS -->
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <section class="padding-medium">
            <div class="container">

                <p id="post-category" class="text-primary"></p>

                <h1 id="post-title" class="display-4 fw-bold mb-4"></h1>

                <img id="post-image"
                    src=""
                    alt=""
                    class="img-fluid rounded-4 mb-5">

                <div id="post-content" class="post-content"></div>

            </div>
        </section>
        <footer class="border-top py-5">

            <div class="container">

                <div class="d-md-flex justify-content-between align-items-center">

                    <p class="mb-0">
                        © 2026 Kiana Asadaki. All rights reserved.
                    </p>

                    <div class="d-flex gap-4 mt-3 mt-md-0">

                        <a href="#">
                            <i class="bi bi-instagram social-icon"></i>
                        </a>

                        <a href="#">
                            <i class="bi bi-github social-icon"></i>
                        </a>

                        <a href="#">
                            <i class="bi bi-linkedin social-icon"></i>
                        </a>

                        <a href="#">
                            <i class="bi bi-youtube social-icon"></i>
                        </a>

                    </div>

                </div>

            </div>

        </footer>



        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>

            const posts = {

                "jwt": {
                    category: "Authentication",
                    title: "JWT Authentication in Django",
                    image: "images/JWT Authentication in Django.png",

                    content: `
                        <p>
                            JWT authentication is a popular method for securing REST APIs
                            built with Django REST Framework.
                        </p>

                        <h2>What is JWT?</h2>

                        <p>
                            JSON Web Token (JWT) allows users to authenticate with an API
                            without maintaining a traditional server-side session.
                        </p>

                        <h2>Access and Refresh Tokens</h2>

                        <p>
                            JWT authentication commonly uses two tokens: an access token
                            and a refresh token. The access token is used to access
                            protected API endpoints, while the refresh token can generate
                            a new access token.
                        </p>

                        <h2>JWT Authentication Flow</h2>

                        <p>
                            The user submits their credentials to the authentication
                            endpoint. After successful authentication, the server returns
                            access and refresh tokens.
                        </p>

                        <h2>Protecting API Endpoints</h2>

                        <p>
                            Django REST Framework can verify the access token before
                            allowing access to protected resources.
                        </p>
                    `
                },


                "google-oauth": {
                    category: "Google OAuth",
                    title: "Google OAuth Authentication With Django",
                    image: "images/Google OAuth Authentication with Django.png",

                    content: `
                        <p>
                            Google OAuth allows users to sign in or create an account
                            using their existing Google account.
                        </p>

                        <h2>Google OAuth in Django</h2>

                        <p>
                            Django applications can integrate Google authentication using
                            django-allauth and Google's OAuth 2.0 service.
                        </p>

                        <h2>Creating Google OAuth Credentials</h2>

                        <p>
                            First, create OAuth credentials in Google Cloud Console and
                            configure the authorized redirect URI for your Django
                            application.
                        </p>

                        <h2>Configuring django-allauth</h2>

                        <p>
                            Install django-allauth and add the required applications,
                            authentication backend, middleware, and Google provider to
                            your Django settings.
                        </p>

                        <h2>Google Sign-In</h2>

                        <p>
                            When the user clicks the Google sign-in button, they are
                            redirected to Google for authentication. After successful
                            authentication, Google redirects the user back to the Django
                            application.
                        </p>
                    `
                },


                "rest-api": {
                    category: "Django REST Framework",
                    title: "Building REST APIs With Django REST Framework",
                    image: "images/Building REST APIs with Django REST Framework.png",

                    content: `
                        <p>
                            Django REST Framework provides powerful tools for building
                            modern RESTful APIs with Django.
                        </p>

                        <h2>Creating an API</h2>

                        <p>
                            Django REST Framework uses serializers, views, and URL routes
                            to expose application data through API endpoints.
                        </p>

                        <h2>Serializers</h2>

                        <p>
                            Serializers convert Django model instances into JSON data and
                            validate incoming API requests.
                        </p>

                        <h2>API Views</h2>

                        <p>
                            API views define how clients interact with resources using
                            HTTP methods such as GET, POST, PUT, PATCH, and DELETE.
                        </p>

                        <h2>API Documentation</h2>

                        <p>
                            API documentation tools such as Swagger can make endpoints
                            easier to understand and test.
                        </p>
                    `
                }

            };


            const params = new URLSearchParams(window.location.search);

            const postName = params.get("post");

            const post = posts[postName];


            if (post) {

                document.getElementById("post-category").textContent = post.category;

                document.getElementById("post-title").textContent = post.title;

                document.getElementById("post-image").src = post.image;

                document.getElementById("post-image").alt = post.title;

                document.getElementById("post-content").innerHTML = post.content;

                document.title = post.title;

            } else {

                document.getElementById("post-title").textContent =
                    "Article Not Found";

            }

            </script>
    </body>

</html>
